name: Decode FaceBatch source archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/decode-source-archive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Decode and commit portable source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d apk/archive/FaceBatch-0.4.0-source-scrubbed.zip.b64 > apk/archive/FaceBatch-0.4.0-source-scrubbed.zip
          echo 'c0b11d070943787ef1f7e0687f84a0ad76f18265901328890ccb090f99e5f405  apk/archive/FaceBatch-0.4.0-source-scrubbed.zip' | sha256sum -c -
          unzip -t apk/archive/FaceBatch-0.4.0-source-scrubbed.zip >/dev/null
          rm apk/archive/FaceBatch-0.4.0-source-scrubbed.zip.b64
          git config user.name 'FaceBatch Snapshot Bot'
          git config user.email 'jonathanjablon-stack@users.noreply.github.com'
          git add apk/archive/FaceBatch-0.4.0-source-scrubbed.zip apk/archive/FaceBatch-0.4.0-source-scrubbed.zip.b64
          git commit -m 'Add portable scrubbed FaceBatch 0.4.0 source archive'
          git push origin HEAD:main
