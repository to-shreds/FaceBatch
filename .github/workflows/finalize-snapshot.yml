name: Finalize FaceBatch snapshot inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Regenerate canonical inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('.')
          manifest_path = Path('manifests/SNAPSHOT.json')
          sums_path = Path('SHA256SUMS')
          transient = Path('.github/workflows/finalize-snapshot.yml')
          excluded_parts = {'.git', '__pycache__'}

          def eligible(path: Path, for_manifest: bool) -> bool:
              if not path.is_file():
                  return False
              rel = path.relative_to(root) if path.is_absolute() else path
              if any(part in excluded_parts for part in rel.parts):
                  return False
              if rel == transient or rel == sums_path:
                  return False
              if for_manifest and rel == manifest_path:
                  return False
              return True

          entries = []
          for path in sorted(root.rglob('*')):
              if not eligible(path, True):
                  continue
              rel = path.relative_to(root)
              data = path.read_bytes()
              entries.append({
                  'path': rel.as_posix(),
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })

          payload = {
              'snapshot': 'FaceBatch status snapshot',
              'snapshot_date': '2026-08-29',
              'android_controlling_release': '0.7.0',
              'web_release': '1.0.0-snapshot-2026-08-29',
              'repository_intended_visibility': 'private',
              'pages_artifact': 'docs',
              'files': entries,
              'file_count': len(entries),
              'total_bytes': sum(item['bytes'] for item in entries),
          }
          manifest_path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')

          lines = []
          for path in sorted(root.rglob('*')):
              if not eligible(path, False):
                  continue
              rel = path.relative_to(root)
              data = path.read_bytes()
              lines.append(f"{hashlib.sha256(data).hexdigest()}  {rel.as_posix()}")
          sums_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git config user.name 'FaceBatch Snapshot Bot'
          git config user.email 'jonathanjablon-stack@users.noreply.github.com'
          git add manifests/SNAPSHOT.json SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize FaceBatch snapshot inventory'
            git push origin HEAD:main
          fi
