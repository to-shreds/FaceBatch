name: Validate FaceBatch snapshot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install browser-test dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow playwright
          python -m playwright install --with-deps chromium
      - name: Validate source and inventory
        run: python scripts/validate_snapshot.py
      - name: Run gateway smoke test
        run: bash web/tests/gateway-smoke.sh
      - name: Run custom adapter smoke test
        run: bash web/tests/custom-adapter-smoke.sh
      - name: Run browser smoke test
        run: python web/tests/browser_smoke.py
